<div class="wrap">
  <h2>{{ id ? 'Edit Student' : 'New Student' }}</h2>
  <form (ngSubmit)="submit()" [formGroup]="form" novalidate>
    <label>
      Name
      <input formControlName="name" placeholder="Full name"/>
    </label>
    <div class="hint" *ngIf="form.controls.name.touched && form.controls.name.invalid">
      Name is required (min 2 chars)
    </div>

    <label>
      Email
      <input formControlName="email" placeholder="email@example.com"/>
    </label>
    <div class="hint" *ngIf="form.controls.email.touched && form.controls.email.invalid">
      Valid email required
    </div>

    <div class="actions">
      <button type="submit" [disabled]="saving || form.invalid">{{ id ? 'Update' : 'Create' }}</button>
      <button type="button" (click)="cancel()">Cancel</button>
    </div>
  </form>
</div>
